<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taschenrechner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator_background">
        <div id="calculator">
                <h3 class="title">Taschenrechner</h3>
            <div class="display">
                <div id="display">0</div>
            </div>
                <div id="buttons">
                    <button data-action="clear" class="button_clear">C</button>
                    <button data-action="delete" onclick="location.href='Easteregg.html'" class="button_del">DEL</button>
                    <button data-action="operator" data-value="/" class="button_geteilt">÷</button>
                    
                    
                    <button data-action="number" data-value="7" class="button_7">7</button>
                    <button data-action="number" data-value="8" class="button_8">8</button>
                    <button data-action="number" data-value="9" class="button_9">9</button>
                    <button data-action="operator" data-value="*" class="button_mal">×</button>
                    
                    
                    <button data-action="number" data-value="4" class="button_4">4</button>
                    <button data-action="number" data-value="5" class="button_5">5</button>
                    <button data-action="number" data-value="6" class="button_6">6</button>
                    <button data-action="operator" data-value="-" class="button_minus">-</button>
                    
                    
                    <button data-action="number" data-value="1" class="button_1">1</button>
                    <button data-action="number" data-value="2" class="button_2">2</button>
                    <button data-action="number" data-value="3" class="button_3">3</button>
                    <button data-action="operator" data-value="+" class="button_plus">+</button>
                    
                    
                    <button data-action="number" data-value="0" class="button_0">0</button>
                    <button data-action="decimal" data-value="." class="button_dezimal">.</button>
                    <button data-action="equals" class="button_gleich">=</button>
                </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
